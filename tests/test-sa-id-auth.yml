name: Test Service Account ID authentication input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create temp root directory with files
        run: |
          mkdir -p /tmp/upload-root-sa
          echo "hello" > /tmp/upload-root-sa/test.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          yc-sa-id: 'fake-service-account-id-for-testing'
          bucket: 'test-bucket'
          root: '/tmp/upload-root-sa'
          include: '*.txt'
      - name: Assert action was invoked with yc-sa-id input
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail when connecting to YC with a fake SA ID,
          # but we verify it was invoked (not skipped) and the input was accepted.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with yc-sa-id input (outcome: ${{ steps.action.outcome }})"
