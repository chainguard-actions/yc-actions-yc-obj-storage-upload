name: Test prefix and cache-control inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create test files
      - name: Create test files
        run: |
          mkdir -p /tmp/prefix-root
          echo "html content" > /tmp/prefix-root/index.html
          echo "js content" > /tmp/prefix-root/app.js

      - name: Run upload action with prefix and cache-control
        id: action
        uses: .
        continue-on-error: true
        with:
          yc-sa-json-credentials: |
            {
              "id": "fake-key-id",
              "service_account_id": "fake-sa-id",
              "created_at": "2024-01-01T00:00:00Z",
              "key_algorithm": "RSA_2048",
              "public_key": "-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0000000000000000000\n-----END PUBLIC KEY-----\n",
              "private_key": "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQC0000000000\n-----END PRIVATE KEY-----\n"
            }
          bucket: fake-test-bucket
          root: /tmp/prefix-root
          prefix: v1.0.0/assets
          include: '*'
          cache-control: |
            *.html=no-cache
            *.js=max-age=31536000

      - name: Assert action ran (even if it failed due to fake credentials)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should complete (success or failure) without a runner crash
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with outcome: ${{ steps.action.outcome }}"
