name: Test prefix and cache-control inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create test files to upload (relative to workspace)
      - name: Create test files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-prefix-root/css"
          mkdir -p "$GITHUB_WORKSPACE/test-prefix-root/js"
          echo "body { color: red; }" > "$GITHUB_WORKSPACE/test-prefix-root/css/style.css"
          echo "console.log('hello');" > "$GITHUB_WORKSPACE/test-prefix-root/js/app.js"
          echo "<html></html>" > "$GITHUB_WORKSPACE/test-prefix-root/index.html"

      # Test with prefix and cache-control inputs - action should fail gracefully
      # on invalid credentials. We use clear=true so the S3 client is invoked in
      # clearBucket (which propagates errors), ensuring the failure is not silently
      # swallowed in the upload path. This validates prefix/cache-control input parsing.
      - id: action
        uses: .
        continue-on-error: true
        with:
          yc-sa-json-credentials: |
            {
              "id": "fake-key-id",
              "created_at": "2023-01-01T00:00:00Z",
              "key_algorithm": "RSA_2048",
              "service_account_id": "fake-sa-id",
              "private_key": "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHABxGMSMFMRMBxMBMBxMB\n-----END RSA PRIVATE KEY-----\n",
              "public_key": "-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0Z3VS5JJcds3xHn/ygWe\n-----END PUBLIC KEY-----\n"
            }
          bucket: fake-bucket
          prefix: v1.0.0
          root: test-prefix-root
          include: |
            *.html
            css/*
            js/*
          exclude: '*.map'
          cache-control: |
            *.html: no-cache
            *.css,*.js: max-age=31536000
          clear: 'true'

      - name: Assert action failed gracefully with prefix and cache-control inputs
        env:
          ACTUAL: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $ACTUAL"
          if [ "$ACTUAL" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $ACTUAL"
            exit 1
          fi
          echo "PASS: action accepted prefix/cache-control inputs and failed gracefully on invalid credentials"
