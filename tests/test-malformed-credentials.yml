name: Test malformed JSON credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a dummy file to upload (relative to workspace)
      - name: Create test file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-upload-root"
          echo "test content" > "$GITHUB_WORKSPACE/test-upload-root/test.txt"

      # The action should fail gracefully (setFailed) when credentials JSON is malformed,
      # because JSON.parse throws a SyntaxError before any file or network operations.
      - id: action
        uses: .
        continue-on-error: true
        with:
          yc-sa-json-credentials: 'this is not valid json'
          bucket: fake-bucket
          root: test-upload-root
          include: '*'

      - name: Assert action failed gracefully on malformed JSON
        env:
          ACTUAL: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $ACTUAL"
          if [ "$ACTUAL" != "failure" ]; then
            echo "FAIL: expected action to fail with malformed JSON credentials, but got outcome: $ACTUAL"
            exit 1
          fi
          echo "PASS: action failed gracefully as expected with malformed JSON credentials"
