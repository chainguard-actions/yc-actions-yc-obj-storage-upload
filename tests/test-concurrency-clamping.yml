name: Test concurrency clamping
on:
  workflow_dispatch:
jobs:
  test-low-concurrency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy upload root
        run: |
          mkdir -p "$GITHUB_WORKSPACE/upload-root"
          echo "test" > "$GITHUB_WORKSPACE/upload-root/test.txt"

      - id: action-low
        uses: .
        continue-on-error: true
        with:
          yc-iam-token: fake-iam-token-that-is-invalid
          bucket: fake-nonexistent-bucket-xyz123
          root: upload-root
          concurrency: '0'
          fail-on-error: 'true'

      - name: Assert action failed gracefully with concurrency=0 (clamped to 1)
        env:
          OUTCOME: ${{ steps.action-low.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Action should fail due to invalid credentials, not due to concurrency parsing
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (invalid credentials), concurrency=0 was accepted"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with a fake IAM token"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

  test-high-concurrency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy upload root
        run: |
          mkdir -p "$GITHUB_WORKSPACE/upload-root"
          echo "test" > "$GITHUB_WORKSPACE/upload-root/test.txt"

      - id: action-high
        uses: .
        continue-on-error: true
        with:
          yc-iam-token: fake-iam-token-that-is-invalid
          bucket: fake-nonexistent-bucket-xyz123
          root: upload-root
          concurrency: '9999'
          fail-on-error: 'true'

      - name: Assert action failed gracefully with concurrency=9999 (clamped to 256)
        env:
          OUTCOME: ${{ steps.action-high.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Action should fail due to invalid credentials, not due to concurrency parsing
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (invalid credentials), concurrency=9999 was accepted"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with a fake IAM token"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
