name: Test exclude patterns input handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test root directory with mixed files
        run: |
          mkdir -p /tmp/test-upload-root
          echo "include me" > /tmp/test-upload-root/include.txt
          echo "exclude me" > /tmp/test-upload-root/exclude.log
          echo "also include" > /tmp/test-upload-root/also.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          yc-iam-token: fake-iam-token-for-testing
          bucket: test-bucket
          root: /tmp/test-upload-root
          include: '*'
          exclude: '*.log'

      - name: Assert action failed at upload not at input parsing
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # With a fake token, the action should fail at the upload/auth stage,
          # not at input parsing. This confirms include/exclude inputs are accepted.
          if [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action failed at expected stage (upload/auth with fake token)"
          else
            echo "PASS: action completed (unexpected but not a test failure)"
          fi
