name: Test include and exclude patterns
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create test files with various extensions
      - name: Create test files
        run: |
          mkdir -p /tmp/pattern-root/subdir
          echo "html content" > /tmp/pattern-root/index.html
          echo "css content" > /tmp/pattern-root/style.css
          echo "js content" > /tmp/pattern-root/app.js
          echo "txt content" > /tmp/pattern-root/readme.txt
          echo "nested html" > /tmp/pattern-root/subdir/page.html

      - name: Run upload action with include/exclude patterns and fake credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          yc-sa-json-credentials: |
            {
              "id": "fake-key-id",
              "service_account_id": "fake-sa-id",
              "created_at": "2024-01-01T00:00:00Z",
              "key_algorithm": "RSA_2048",
              "public_key": "-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0000000000000000000\n-----END PUBLIC KEY-----\n",
              "private_key": "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQC0000000000\n-----END PRIVATE KEY-----\n"
            }
          bucket: fake-test-bucket
          root: /tmp/pattern-root
          include: |
            *.html
            *.css
          exclude: |
            *.txt

      - name: Assert action ran (even if it failed due to fake credentials)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should complete (success or failure) without a runner crash
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with outcome: ${{ steps.action.outcome }}"
