name: Test no credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test root directory
        run: mkdir -p /tmp/test-upload-root && echo "hello" > /tmp/test-upload-root/test.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          bucket: test-bucket
          root: /tmp/test-upload-root
          # No credentials provided — should fail with "No credentials"

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when no credentials provided"
            exit 1
          fi
          echo "PASS: action correctly failed with no credentials"
