name: Test no credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy upload root
        run: |
          mkdir -p "$GITHUB_WORKSPACE/upload-root"
          echo "hello" > "$GITHUB_WORKSPACE/upload-root/test.txt"

      - id: action
        uses: .
        continue-on-error: true
        with:
          bucket: fake-bucket
          root: upload-root
          include: '*'
          # No credentials provided — should fail with "No credentials"

      - name: Assert action failed gracefully with no credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when no credentials are provided"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed without credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
