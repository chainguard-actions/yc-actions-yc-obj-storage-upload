name: Test upload with cache-control header
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files to upload
        run: |
          mkdir -p /tmp/upload-cache-root
          echo "<html><body>Hello</body></html>" > /tmp/upload-cache-root/index.html
          echo "body { color: red; }" > /tmp/upload-cache-root/style.css
          echo "console.log('hello');" > /tmp/upload-cache-root/app.js

      - name: Run upload action with cache-control (expect auth failure with dummy credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          yc-sa-json-credentials: |
            {
              "id": "dummy-key-id",
              "service_account_id": "dummy-sa-id",
              "created_at": "2024-01-01T00:00:00Z",
              "key_algorithm": "RSA_2048",
              "public_key": "-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0000000000000000000\n-----END PUBLIC KEY-----\n",
              "private_key": "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQC0000000000\n-----END PRIVATE KEY-----\n"
            }
          bucket: test-bucket
          root: /tmp/upload-cache-root
          include: |
            *.html
            *.css
            *.js
          exclude: ''
          prefix: 'v1/'
          cache-control: |
            *.html=no-cache, no-store
            *.css=max-age=31536000
            *.js=max-age=31536000

      - name: Assert action ran with cache-control option
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail due to authentication
          # with dummy credentials — both confirm the action was invoked correctly
          # with cache-control headers configured.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with cache-control and produced a definitive outcome"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
