name: Test basic upload with no credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files to upload
        run: |
          mkdir -p /tmp/upload-root
          echo "hello world" > /tmp/upload-root/hello.txt
          echo "test file" > /tmp/upload-root/test.txt

      - name: Run upload action (expect failure due to missing credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          bucket: 'test-bucket'
          root: '/tmp/upload-root'
          include: '*.txt'
          prefix: 'test-prefix'
          clear: 'false'

      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with missing credentials"
