name: Test upload with invalid SA JSON credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files to upload
        run: |
          mkdir -p /tmp/sa-upload-root/subdir
          echo "file one" > /tmp/sa-upload-root/file1.txt
          echo "file two" > /tmp/sa-upload-root/subdir/file2.txt
          echo "excluded" > /tmp/sa-upload-root/skip.log

      - name: Run upload action with malformed SA JSON credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          yc-sa-json-credentials: 'not-valid-json'
          bucket: 'my-test-bucket'
          root: '/tmp/sa-upload-root'
          include: '*.txt'
          exclude: '*.log'
          prefix: 'uploads/v1'
          clear: 'false'
          cache-control: ''

      - name: Assert action failed due to invalid SA JSON credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid SA JSON credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid SA JSON credentials"
