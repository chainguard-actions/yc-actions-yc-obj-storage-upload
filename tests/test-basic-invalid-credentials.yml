name: Test basic usage with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a dummy file to upload (relative to workspace)
      - name: Create test file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-upload-root"
          echo "hello world" > "$GITHUB_WORKSPACE/test-upload-root/hello.txt"

      # The action should fail gracefully (setFailed) when credentials are invalid.
      # We use clear=true so the S3 client is invoked in clearBucket (which propagates
      # errors), ensuring the invalid credentials cause a failure rather than being
      # silently swallowed in the upload path.
      - id: action
        uses: .
        continue-on-error: true
        with:
          yc-sa-json-credentials: |
            {
              "id": "fake-key-id",
              "created_at": "2023-01-01T00:00:00Z",
              "key_algorithm": "RSA_2048",
              "service_account_id": "fake-sa-id",
              "private_key": "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHABxGMSMFMRMBxMBMBxMB\n-----END RSA PRIVATE KEY-----\n",
              "public_key": "-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0Z3VS5JJcds3xHn/ygWe\n-----END PUBLIC KEY-----\n"
            }
          bucket: fake-bucket
          root: test-upload-root
          include: '*'
          clear: 'true'

      - name: Assert action failed gracefully
        env:
          ACTUAL: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $ACTUAL"
          if [ "$ACTUAL" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $ACTUAL"
            exit 1
          fi
          echo "PASS: action failed gracefully as expected with invalid credentials"
