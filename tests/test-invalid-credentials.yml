name: Test invalid JSON credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run upload action with malformed JSON credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          yc-sa-json-credentials: 'this is not valid json {'
          bucket: fake-test-bucket
          root: /tmp/nonexistent-root

      - name: Assert action failed due to invalid JSON
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid JSON credentials, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid JSON credentials"
