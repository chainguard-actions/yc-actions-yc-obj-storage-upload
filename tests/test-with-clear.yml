name: Test upload with clear bucket option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files to upload
        run: |
          mkdir -p /tmp/upload-clear-root
          echo "file one" > /tmp/upload-clear-root/file1.txt
          echo "file two" > /tmp/upload-clear-root/file2.txt
          mkdir -p /tmp/upload-clear-root/subdir
          echo "nested file" > /tmp/upload-clear-root/subdir/nested.txt

      - name: Run upload action with clear=true (expect auth failure with dummy credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          yc-sa-json-credentials: |
            {
              "id": "dummy-key-id",
              "service_account_id": "dummy-sa-id",
              "created_at": "2024-01-01T00:00:00Z",
              "key_algorithm": "RSA_2048",
              "public_key": "-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0000000000000000000\n-----END PUBLIC KEY-----\n",
              "private_key": "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQC0000000000\n-----END PRIVATE KEY-----\n"
            }
          bucket: test-bucket
          root: /tmp/upload-clear-root
          clear: 'true'
          include: |
            *.txt
            subdir/*.txt

      - name: Assert action ran with clear option
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail due to authentication
          # with dummy credentials — both confirm the action was invoked correctly.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with clear=true and produced a definitive outcome"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
