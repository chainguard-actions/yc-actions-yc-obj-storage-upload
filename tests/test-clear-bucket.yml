name: Test upload with clear bucket option and no credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files to upload
        run: |
          mkdir -p /tmp/clear-upload-root
          echo "content a" > /tmp/clear-upload-root/a.txt
          echo "content b" > /tmp/clear-upload-root/b.txt

      - name: Run upload action with clear=true (expect failure due to missing credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          bucket: 'test-bucket-to-clear'
          root: '/tmp/clear-upload-root'
          include: '*'
          exclude: ''
          prefix: ''
          clear: 'true'

      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing credentials when clear=true, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with missing credentials (clear=true path)"
