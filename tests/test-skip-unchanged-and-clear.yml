name: Test skip-unchanged and clear options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy upload root
        run: |
          mkdir -p "$GITHUB_WORKSPACE/upload-root"
          echo "file content" > "$GITHUB_WORKSPACE/upload-root/file.txt"
          echo "another content" > "$GITHUB_WORKSPACE/upload-root/other.txt"

      - id: action
        uses: .
        continue-on-error: true
        with:
          yc-iam-token: fake-iam-token-that-is-invalid
          bucket: fake-nonexistent-bucket-xyz123
          root: upload-root
          include: '*.txt'
          clear: 'true'
          skip-unchanged: 'true'
          fail-on-error: 'false'

      - name: Assert action failed gracefully with clear and skip-unchanged options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Action should fail due to invalid credentials (clear bucket will fail first)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with a fake IAM token and nonexistent bucket"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
