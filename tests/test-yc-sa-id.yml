name: Test yc-sa-id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files to upload
        run: |
          mkdir -p /tmp/test-sa-id-root
          echo "hello" > /tmp/test-sa-id-root/hello.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          yc-sa-id: fake-sa-id-for-coverage
          bucket: fake-bucket
          root: /tmp/test-sa-id-root
          include: '*'

      - name: Assert action ran with yc-sa-id input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
