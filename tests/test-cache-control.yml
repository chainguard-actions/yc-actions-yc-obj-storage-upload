name: Test cache-control configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy upload root with various file types
        run: |
          mkdir -p "$GITHUB_WORKSPACE/upload-root/assets"
          echo "<html></html>" > "$GITHUB_WORKSPACE/upload-root/index.html"
          echo "body{}" > "$GITHUB_WORKSPACE/upload-root/assets/style.css"
          echo "console.log()" > "$GITHUB_WORKSPACE/upload-root/assets/app.js"

      - id: action
        uses: .
        continue-on-error: true
        with:
          yc-iam-token: fake-iam-token-that-is-invalid
          bucket: fake-nonexistent-bucket-xyz123
          root: upload-root
          include: |
            *.html
            assets/*
          cache-control: |
            *.html=no-cache, no-store
            assets/*=public, max-age=31536000
          fail-on-error: 'true'

      - name: Assert action failed gracefully with cache-control config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Action should fail due to invalid credentials, not due to cache-control parsing
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (invalid credentials), cache-control config was accepted"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with a fake IAM token and nonexistent bucket"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
